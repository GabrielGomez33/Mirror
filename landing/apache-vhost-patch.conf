# =============================================================================
# Apache patch — point theundergroundrailroad.world root at the Mirror landing
# =============================================================================
# Apply to: /etc/apache2/sites-available/theundergroundrailroad.world.conf
#
# Two edits inside the existing <VirtualHost *:443> block:
#
#   1. Change ONE line at the top:
#        DocumentRoot /var/www/tugrr-storage1
#      to
#        DocumentRoot /var/www/marketing/mirror
#
#   2. In the "# STATIC FILES" section, ABOVE the existing
#        Alias "/admin" "/var/www/admin"
#      block, paste the two <Directory> blocks below.
#
# Then:
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2
# =============================================================================

# --- Paste this block into the STATIC FILES section --------------------------

# Marketing landing (bare domain root — served from the new DocumentRoot)
<Directory "/var/www/marketing/mirror">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.html
</Directory>

# Preserve old root contents (still on disk, reachable at /storage)
Alias "/storage" "/var/www/tugrr-storage1"
<Directory "/var/www/tugrr-storage1">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# --- end paste ---------------------------------------------------------------
